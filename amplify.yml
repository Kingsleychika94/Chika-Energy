version: 1
frontend:
  phases:
    preBuild:
      commands:
        # Installs deps including @sparticuz/chromium, which bundles a Chromium
        # that runs on the Amazon Linux build image with no extra OS packages.
        # (No `playwright install` needed — that requires apt-get, which the
        # Amplify image does not have.)
        - npm install --no-audit --no-fund
    build:
      commands:
        # Runs `vite build` then `node prerender.mjs` (see package.json "build")
        - npm run build
  artifacts:
    baseDirectory: dist
    files:
      - '**/*'
  cache:
    paths:
      - node_modules/**/*
